<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Aplicacion Tipo CRUD</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>

</head>
<body>

    <h1 class="text-center mt-5 mb-5 text-primary">Aplicacion Tipo CRUD</h1>

    <div class="container">
        <div class="card shadow">
            <div class="card-body">
                <form action="/usuarios" method="POST">
                    <div class="row mb-3">
                        <div class="col">
                            <label>Username</label>
                            <input type="text" class="form-control mb-3" name="username" placeholder="Username" required>
                        </div>
                        <div class="col">
                            <label>Nombre</label>
                            <input type="text" class="form-control mb-3" name="nombre" placeholder="Nombre" required>
                        </div>
                        <div class="col">
                            <label>Contraseña</label>
                            <input type="text" class="form-control mb-3" name="contra" placeholder="Contra" required>
                        </div>
                        <div class="col">
                            <button type="submit" class="btn btn-primary mb-3 mt-4">Enviar</button>
                        </div>
                    </div>
                </form>

                <!--- Tabla de usuarios--->

                <table class="table table-bordered shadow">
                    <thead>
                        <th scope="col">#</th>
                        <th scope="col">Username</th>
                        <th scope="col">Nombre</th>
                        <th scope="col">Contra</th>
                        <th scope="col">Saldo</th>
                        <th scope="col">Editar</th>
                        <th scope="col">Eliminar</th>
                    </thead>
                <tbody>
                    {%  for d in data %}
                        <tr>
                            <td>{{d.id}}</td>
                            <td>{{d.username}}</td>
                            <td>{{d.nombre}}</td>
                            <td>{{d.contra}}</td>
                            <td>{{d.saldo}}</td>
                            <td><button class="btn btn-primary btn-sm" id="editar{{d.id}}" data-bs-toggle="modal" data-bs-target="#modal{{d.id}}">Editar</button></td>
                            <td><a href="{{url_for('eliminar', id=d.id)}}" class="btn btn-danger btn-sm">Eliminar</a></td>
                        </tr>

                        <!-- Modal -->
                        <div class="modal fade" id="modal{{d.id}}" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
                          <div class="modal-dialog">
                            <div class="modal-content">
                              <div class="modal-header">
                                <h1 class="modal-title fs-5" id="exampleModalLabel">{{d.username}}</h1>
                                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                              </div>
                              <div class="modal-body">
                                  <form action="/editar/{{d.id}}" method="POST">
                                      <label>Username</label>
                                      <input type="text" class="form-control mb-3" name="username" placeholder="Username" required value="{{d.username}}">
                                      <label>Nombre</label>
                                      <input type="text" class="form-control mb-3" name="nombre" placeholder="Nombre" required value="{{d.nombre}}">
                                      <label>Contraseña</label>
                                      <input type="text" class="form-control mb-3" name="contra" placeholder="Contra" required value="{{d.contra}}">

                              </div>
                              <div class="modal-footer">
                                <button type="submit" class="btn btn-primary">Guardar</button>
                              </div>
                              </form>
                            </div>
                          </div>
                        </div>


                    {%  endfor %}
                </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
