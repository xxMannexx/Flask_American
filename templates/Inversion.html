<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inversiones</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../static/css/inversion.css" />
</head>
<body>

  <div class="container">
    <h1 class="dashboard-title">Inversiones</h1>

    <div class="row mb-5">
      <div class="col-12 col-md-6 mx-auto">
            <div class="form-floating">
                <input type="text" class="form-control color input borde" name="dinero" id="dinero" placeholder="cagada" required/>
                <label for="dinero" style="color: gold;" class="color" >Dinero a invertir</label>
            </div>
      </div>
    </div>

    <h2 class="dashboard-title">Métricas</h2>

    <div class="row g-4">

      <div class="col-md-4">
        <div class="dashboard-card">
          <h5>Porcentaje</h5>
          <label class="label-color label">2</label>
        </div>
      </div>

      <div class="col-md-4">
        <div class="dashboard-card">
          <h5>Ganancias</h5>
          <label class="label-color label">3</label>
        </div>
      </div>

      <div class="col-md-4">
        <div class="dashboard-card">
          <h5>Periodo de Pago</h5>
          <label class="label-color label">4</label>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"></script>
</body>
</html>
