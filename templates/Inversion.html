<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inversiones</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../static/css/inversion.css" />
</head>
<body>

  <div class="container">
    <h1 class="dashboard-title">Inversiones</h1>

    <div class="row mb-5">
      <div class="col-12 col-md-6 mx-auto">
          <form method="POST" action="/inversion_crear">
            <div class="input-group">
              <div class="form-floating">
                  <input type="number" min="0"  disabled class="form-control  color input borde" name="dinero" id="dinero" placeholder="cagada" required/>
                  <label for="dinero"  id="dinero_label" style="color: gold;" >Dinero a invertir</label>
              </div>
              <button class="btn btn-outline-warning" disabled type="submit" id="subir">Invertir</button>
            </div>

          </form>

      </div>
    </div>

    <h2 class="dashboard-title">Métricas</h2>

    <div class="row g-4">

      <div class="col-md-4">
        <div class="dashboard-card">
          <h5>Porcentaje</h5>
          <label class="label-color label">{{ data.tasa_gat }}</label>
        </div>
      </div>

      <div class="col-md-4">
        <div class="dashboard-card">
          <h5>Ganancias</h5>
          <label class="label-color label">{{ data.ganancia_mes }}</label>
        </div>
      </div>

      <div class="col-md-4">
        <div class="dashboard-card">
          <h5>Monto inicial</h5>
          <label class="label-color label">{{ data.monto_inversion }}</label>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"></script>
    <script>
        if ('{{ data.hay }}' === 'True' ){
            document.getElementById('dinero').disabled = true;
            document.getElementById('subir').disabled = true;
            document.getElementById('dinero_label').disabled = true;
        } else{
            document.getElementById('dinero').disabled = false;
            document.getElementById('subir').disabled = false;
        }
        if ('{{ data.error }}' != 'nada' ) {
            window.alert('{{ data.error }}');
        }
    </script>
</body>
</html>
