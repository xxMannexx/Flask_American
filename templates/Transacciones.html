<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Transacciones</title>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <link rel="stylesheet" href="../static/css/estilos_transacciones.css">
</head>
<body>
  <div class="container"></div>
    <h1  class="mb-4">TRANSACCIONES</h1>
    <div class="container">
        <div class="table-responsive">
            <table class="table table-dark">
                <thead class="text-dark">
                    <tr>
                        <th scope="col">Folio</th>
                        <th scope="col">Tipo de Operacion</th>
                        <th scope="col">Monto</th>
                        <th scope="col">fecha</th>
                    </tr>
                </thead>
                <tbody>
                    {% for d in data %}
                    <tr>
                        <td>{{d.id}}</td>
                        <td>{{d.tipo}}</td>
                        <td>{{d.monto}}</td>
                        <td>{{d.fecha}}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
